<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A5D7A" />
      <stop offset="100%" stop-color="#123F53" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#C6A15B" />
    </linearGradient>
  </defs>

  <!-- Logo Mark / Icon -->
  <g transform="translate(10, 5)">
    <!-- Sol / Estrella dorada -->
    <path d="M 45 6 L 47 16 L 57 18 L 47 20 L 45 30 L 43 20 L 33 18 L 43 16 Z" fill="#C6A15B" />

    <!-- Cabeza persona izquierda -->
    <circle cx="28" cy="22" r="6" fill="#1A5D7A" />
    <!-- Cabeza persona derecha -->
    <circle cx="62" cy="22" r="6" fill="#1A5D7A" />

    <!-- Silueta de Bogotá (edificios en dorado en el centro) -->
    <path d="M 38 46 L 38 32 L 43 30 L 47 30 L 51 34 L 51 46 Z" fill="#C6A15B" opacity="0.9" />
    <path d="M 42 46 L 42 26 L 46 23 L 48 26 L 48 46 Z" fill="#D4AF37" />

    <!-- Cordillera / Brazos conectados formando montañas -->
    <path d="M 14 52 C 20 40, 36 28, 45 32 C 54 28, 70 40, 76 52 C 68 58, 56 46, 45 48 C 34 46, 22 58, 14 52 Z" fill="#1A5D7A" />
    <!-- Base inferior de montaña y río/camino dorado -->
    <path d="M 12 56 C 24 50, 38 60, 48 54 C 58 60, 68 50, 78 56 C 70 74, 55 64, 45 74 C 35 64, 20 74, 12 56 Z" fill="#123F53" />
    <path d="M 22 66 C 30 60, 38 66, 46 62 C 38 72, 28 72, 22 66 Z" fill="#C6A15B" />
  </g>

  <!-- Typography: GuianzApp -->
  <text x="105" y="58" font-family="'Poppins', 'Manrope', 'Inter', sans-serif" font-weight="700" font-size="44" fill="#1A5D7A" letter-spacing="-0.5px">Guianz<tspan fill="#C6A15B">App</tspan></text>
</svg>
